<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
  <th:block
    th:fragment="links"
    th:with="source_link=${(#strings.trim(theme.config.basic.source_link) !='' && theme.config.basic.enable_source_link)? theme.config.basic.source_link : '/themes/theme-Joe3'}"
  >
    <link rel="shortcut icon" size="32x32" th:href="${site.favicon}" />
    <link rel="canonical" th:href="${site.url}" />
    <link rel="apple-touch-icon" sizes="180x180" th:href="${site.favicon}" />
    <!-- 第三方域预连接：减少首屏 DNS+TLS 握手延迟 -->
    <link rel="preconnect" href="//i.czl.net" crossorigin />
    <th:block th:replace="~{modules/key_css :: key_css}" />
    <th:block th:if="${theme.config.theme.enable_loading_bar}">
      <!-- 加载条 -->
      <link
        rel="stylesheet"
        th:href="${source_link+'/assets/lib/nprogress/nprogress.min.css?v='+theme.spec.version}"
      />
      <style th:inline="text">
        #nprogress .bar {
          height: [[${theme.config.theme.loading_bar_height ?: '3px'}]];
          background: var(--loading-bar);
        }
        #nprogress .peg {
          display: none;
        }
      </style>
      <script
        th:src="${source_link+'/assets/lib/nprogress/nprogress.min.js?v='+theme.spec.version}"
      ></script>
    </th:block>
    <!-- 首屏关键 CSS：直接同步加载，浏览器自动按出现顺序优先级处理 -->
    <link
      rel="stylesheet"
      th:href="${source_link+'/assets/css/min/normalize.min.css?v='+theme.spec.version}"
    />
    <!-- 本地图标库：基于 Lucide 的 SVG mask 实现，零外部 CDN 依赖（含 fa-download 兼容垫片） -->
    <link
      rel="stylesheet"
      th:href="${source_link+'/assets/css/min/iconfont.min.css?v='+theme.spec.version}"
    />
    <th:block
      th:if="${theme.config.custom.iconfont != '' and theme.config.custom.iconfont != null}"
    >
      <link rel="stylesheet" th:href="${theme.config.custom.iconfont}" />
    </th:block>
    <link
      rel="stylesheet"
      th:href="${source_link+'/assets/css/min/theme.min.css?v='+theme.spec.version}"
    />
    <style th:inline="text">
      /* 内容区宽度上限。两处刻意的写法：
         1) 选择器用直接子元素，避免连带命中左侧导航轨内部的 .joe_container
            （#Joe .joe_container 的 ID 特异性会压过 .joe_header__above .joe_container）
         2) 断点在原 1360px 基础上加了展开轨宽度 220px + 边距 30px，
            使同一台设备上正文的实际可用宽度与改成左侧导航之前保持一致；
            不够宽时保持流式，由 sidenav.less 的 padding-left 负责让位 */
      @media (min-width: [[${theme.config.basic.content_max_width + 250}]]px) {
        #Joe > .joe_container {
          max-width: [[${theme.config.basic.content_max_width + 'px'}]] !important;
        }
      }
    </style>
    <link
      rel="stylesheet"
      th:href="${source_link+'/assets/lib/qmsg/qmsg.css?v='+theme.spec.version}"
    />
    <th:block th:if="${htmlType == 'index'} and ${theme.config.carousel.enable_banner}">
      <link
        rel="stylesheet"
        th:href="${source_link+'/assets/lib/swiper/swiper-bundle.min.css?v='+theme.spec.version}"
      />
    </th:block>
    <th:block th:if="${htmlType == 'post' or htmlType == 'journals' or htmlType == 'sheet'}">
      <link
        rel="stylesheet"
        th:href="${source_link+'/assets/lib/prism/prism.min.css?v='+theme.spec.version}"
      />
      <!-- 代码块主题：CZL 自定义主题，自动跟随明暗模式，不再依赖 prism-themes 第三方主题 -->
      <link
        rel="stylesheet"
        th:href="${source_link+'/assets/css/min/prism-czl.min.css?v='+theme.spec.version}"
      />
    </th:block>
    <link
      rel="stylesheet"
      th:href="${source_link+'/assets/css/min/global.min.css?v='+theme.spec.version}"
    />
    <th:block th:if="${htmlType == 'index'}">
      <link
        rel="stylesheet"
        th:href="${source_link+'/assets/css/min/index.min.css?v='+theme.spec.version}"
      />
    </th:block>
    <th:block th:if="${htmlType == 'post'}">
      <link
        rel="stylesheet"
        th:href="${source_link+'/assets/css/min/post.min.css?v='+theme.spec.version}"
      />
    </th:block>
    <th:block th:if="${htmlType == 'journals'}">
      <link
        rel="stylesheet"
        th:href="${source_link+'/assets/css/min/journals.min.css?v='+theme.spec.version}"
      />
    </th:block>
    <th:block th:if="${htmlType == 'friends'}">
      <link
        rel="stylesheet"
        th:href="${source_link+'/assets/css/min/friends.min.css?v='+theme.spec.version}"
      />
    </th:block>
    <th:block th:if="${htmlType == 'archives'}">
      <link
        rel="stylesheet"
        th:href="${source_link+'/assets/css/min/archives.min.css?v='+theme.spec.version}"
      />
    </th:block>
    <th:block th:if="${htmlType == 'photos'}">
      <link
        rel="stylesheet"
        th:href="${source_link+'/assets/lib/justifiedGallery/justifiedGallery.min.css?v='+theme.spec.version}"
      />
      <link
        rel="stylesheet"
        th:href="${source_link+'/assets/css/min/photos.min.css?v='+theme.spec.version}"
      />
    </th:block>
    <!-- 纸质版式层：刻意放在 global 与页面级样式之后、responsive 之前，
         既能覆写 Joe 原版排版默认值，又不夺走响应式断点的最终裁定权 -->
    <link
      rel="stylesheet"
      th:href="${source_link+'/assets/css/min/paper.min.css?v='+theme.spec.version}"
    />
    <!-- 扁平纸面层：必须排在 paper 之后，才能覆写它给正文/侧栏加的那圈纸面描边 -->
    <link
      rel="stylesheet"
      th:href="${source_link+'/assets/css/min/flat.min.css?v='+theme.spec.version}"
    />
    <!-- 左侧导航层：与 paper 同一档（global 之后、responsive 之前）。
         只在 >=769px 生效，移动端仍走 responsive.less 的顶栏 + 抽屉 -->
    <link
      rel="stylesheet"
      th:href="${source_link+'/assets/css/min/sidenav.min.css?v='+theme.spec.version}"
    />
    <link
      rel="stylesheet"
      th:href="${source_link+'/assets/css/min/responsive.min.css?v='+theme.spec.version}"
    />
    <!-- fancybox CSS：异步加载（图片放大功能在用户点击时才需要） -->
    <link
      rel="stylesheet"
      href="https://i.czl.net/jsdelivr/npm/fancybox@3.0.1/dist/css/jquery.fancybox.min.css"
      media="print"
      onload="this.media = 'all'"
    />
    <link
      th:if="${theme.config.basic.comment_option == 'waline'} and ${#strings.trim(theme.config.basic.waline.waline_serverURL) !=''}"
      rel="stylesheet"
      th:href="${theme.config.basic.waline.waline_css}"
      media="print"
      onload="this.media = 'all'"
    />
    <link
      rel="stylesheet"
      th:href="${source_link+'/assets/css/min/beauty.min.css?v='+theme.spec.version}"
    />
    <th:block th:if="${theme.config.beauty.enable_big_banner}">
      <link
        rel="stylesheet"
        th:href="${source_link+'/assets/css/min/big-banner.min.css?v='+theme.spec.version}"
      />
    </th:block>
    <style
      th:if="${theme.config.custom.custom_css != null and theme.config.custom.custom_css != ''}"
      th:utext="${theme.config.custom.custom_css}"
    ></style>
  </th:block>
</html>
