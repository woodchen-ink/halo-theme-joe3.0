<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <th:block th:fragment="key_css">
    <style th:inline="text">
      html body {
          /* 主题色由 theme.less 集中管理（CZL 冷色调），此处仅同步 waline 等第三方组件的 token */
          --waline-avatar-size: 2.25rem;
          --waline-m-avatar-size: calc(var(--waline-avatar-size) * 9 / 13);
          --waline-theme-color: var(--theme);
          --waline-active-color: var(--theme);
          --wave-color: [[${theme.config.beauty.light_color}?:'#fff']];
          /* 加载条颜色主题侧固定，不做后台配置 */
          --loading-bar: var(--theme);
          --img-max-width: 100%;
          /* 字体统一走 theme.less 的 --font-default（body 上生效），此处只同步给评论/搜索挂件 */
          --halo-comment-widget-base-font-family: var(--font-default);
          --halo-search-widget-base-font-family: var(--font-default);
          --halo-comment-widget-base-color: var(--main);
          --halo-comment-widget-base-info-color:var(--routine);
      }
      html[data-mode='dark'] body {
          /* 暗色主题色与 waline 同步，色值来自 theme.less .dark 块 */
          --waline-theme-color: var(--theme);
          --waline-active-color: var(--theme);
          --wave-color: [[${theme.config.beauty.dark_color}?:'#fff']];
          --loading-bar: var(--theme);
          /* 挂件颜色全部引用 theme.less 暗色 token，不散写 hex（emoji-picker 的 rgb 三元组格式除外） */
          --halo-search-widget-color-modal-layer: rgba(0, 0, 0, 0.8);
          --halo-search-widget-color-modal-content-bg: var(--paper-card);
          --halo-search-widget-color-form-input: var(--ink);
          --halo-search-widget-color-form-input-placeholder: var(--ink-muted);
          --halo-search-widget-color-form-input-bg: var(--paper-card);
          --halo-search-widget-color-form-divider: var(--classB);
          --halo-search-widget-color-result-item-bg: var(--paper-card);
          --halo-search-widget-color-result-item-hover-bg: var(--secondary-background);
          --halo-search-widget-color-result-item-title: var(--ink);
          --halo-search-widget-color-result-item-content: var(--ink-muted);
          --halo-search-widget-color-command-kbd-item: var(--ink-muted);
          --halo-search-widget-color-command-kbd-border: var(--classB);
          --halo-search-widget-color-result-empty: var(--ink-muted);
          --halo-comment-widget-component-form-input-bg-color: var(--paper-card);
          --halo-comment-widget-component-form-input-color: var(--ink);
          --halo-comment-widget-component-form-input-border-color: var(--classB);
          --halo-comment-widget-component-form-input-border-color-focus: var(--ink-muted);
          --halo-comment-widget-component-form-input-box-shadow-focus: 0 0 0 0.15em var(--classB);
          --halo-comment-widget-component-form-button-login-bg-color: var(--secondary-background);
          --halo-comment-widget-component-form-button-login-bg-color-hover: var(--paper-raised);
          --halo-comment-widget-component-form-button-login-border-color: var(--classB);
          --halo-comment-widget-component-form-button-submit-border-color: var(--classB);
          --halo-comment-widget-component-form-button-submit-border-color-hover: var(--ink-muted);
          --halo-comment-widget-component-form-button-emoji-color: var(--ink-soft);

          --halo-comment-widget-component-comment-item-action-bg-color-hover: var(--secondary-background);
          --halo-comment-widget-component-comment-item-action-color: var(--ink-muted);
          --halo-comment-widget-component-comment-item-action-color-hover: var(--ink-soft);

          --halo-comment-widget-component-pagination-button-bg-color-hover: var(--secondary-background);
          --halo-comment-widget-component-pagination-button-bg-color-active: var(--secondary-background);
          --halo-comment-widget-component-pagination-button-border-color-active: var(--classB);

          --halo-comment-widget-component-emoji-picker-rgb-color: 229, 231, 234;
          --halo-comment-widget-component-emoji-picker-rgb-accent: 138, 142, 148;
          --halo-comment-widget-component-emoji-picker-rgb-background: 0, 0, 0;
          --halo-comment-widget-component-emoji-picker-rgb-input: 30, 32, 36;
          --halo-comment-widget-component-emoji-picker-color-border: rgba(255, 255, 255, 0.1);
          --halo-comment-widget-component-emoji-picker-color-border-over: rgba(255, 255, 255, 0.2);
      }
      [# th:if="${theme.config.basic.enable_background_light} and ${theme.config.basic.background_light_mode != ''}"]
      html[data-mode="light"] body {
        background-repeat: no-repeat;
        background-size: cover;
        position: relative;
      }

      html[data-mode="light"] body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("[[${theme.config.basic.background_light_mode}]]");
        background-position: top center;
        background-size: cover;
        background-repeat: no-repeat;
        z-index: -1; /* 保证内容层在背景之上 */
      }

      [/]
      [# th:if="${theme.config.basic.enable_background_light != true} or ${theme.config.basic.background_light_mode == ''} or ${theme.config.basic.background_light_mode == null}"]
      html[data-mode="dark"] body {
        background-repeat: no-repeat;
        background-size: cover;
        position: relative;
      }

      html[data-mode="dark"] body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("[[${theme.config.basic.background_dark_mode}]]");
        background-position: top center;
        background-size: cover;
        background-repeat: no-repeat;
        z-index: -1; /* 保证内容层在背景之上 */
      }

      [/]
      [# th:if="${theme.config.basic.enable_background_dark != true} or ${theme.config.basic.background_dark_mode == ''} or ${theme.config.basic.background_dark_mode == null}"]
      html[data-mode="dark"] body {
          background-image: none;
      }
      [/]
    </style>
  </th:block>
</html>
