apiVersion: theme.halo.run/v1alpha1
kind: Theme
metadata:
  name: theme-Joe3
spec:
  displayName: Inkstone
  author:
    name: wood
    website: 'https://woodchen.ink'
  # CC BY-NC-SA 4.0 的 BY 条款要求保留原作者署名，改名后仍在此注明来源
  description: 纸墨风格的 Halo 主题 · 基于 Jiewenhuang 的 halo-theme-joe3.0 二次开发
  # 留空：原值是上游 Joe3 的宣传图（第三方图床外链），扁平化重做后已完全不符
  logo: ''
  website: 'https://woodchen.ink'
  repo: 'https://github.com/woodchen-ink/halo-theme-inkstone'
  # 下面两个键与 metadata.name 一样是配置的存储键，改动会让后台已有设置全部丢失，
  # 因此改名时刻意保持原值不动
  settingName: 'theme-Joe-setting'
  configMapName: 'theme-Joe-configMap'
  version: '2026.09.10-1155'
  require: '>=2.19.0'
  customTemplates:
    page:
      - name: 留言板
        description: 留言板文章
        screenshot:
        file: page_leaving.html
      - name: 友链
        description: 友链模板
        screenshot:
        file: page_links.html
